<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="780" viewBox="0 0 1800 780">
  <defs>
    <style>
      .title { font: 700 30px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .subtitle { font: 500 17px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
      .label { font: 600 18px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .small { font: 500 15px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #6b7280; }
      .eq { font: 600 16px 'JetBrains Mono', 'Consolas', monospace; fill: #1f2937; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 20; ry: 20; }
      .input { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
      .hidden { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .output { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
      .act { fill: #fce7f3; stroke: #be185d; stroke-width: 2; rx: 12; ry: 12; }
      .bias { fill: #fde68a; stroke: #92400e; stroke-width: 2; }
      .arrow { stroke: #2563eb; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .arrow2 { stroke: #059669; stroke-width: 2.6; fill: none; marker-end: url(#arrow2); }
      .arrow3 { stroke: #d97706; stroke-width: 2.6; fill: none; marker-end: url(#arrow3); }
      .thin { stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1800" height="780" fill="#ffffff"/>
  <text x="900" y="46" text-anchor="middle" class="title">两层感知机：输入先变成中间特征，再合成最终概率</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">第一层和第二层都各有一个 bias，第二层的权重 W2 也明确画出来了。</text>

  <rect x="40" y="110" width="1720" height="610" class="panel"/>

  <text x="170" y="160" text-anchor="middle" class="label">输入 x</text>
  <circle cx="170" cy="250" r="30" class="input"/>
  <text x="170" y="258" text-anchor="middle" class="label">x1</text>
  <circle cx="170" cy="350" r="30" class="input"/>
  <text x="170" y="358" text-anchor="middle" class="label">x2</text>
  <text x="170" y="410" text-anchor="middle" class="small">原始输入特征</text>

  <text x="560" y="160" text-anchor="middle" class="label">第一层</text>
  <circle cx="560" cy="210" r="28" class="hidden"/>
  <text x="560" y="218" text-anchor="middle" class="label">h1</text>
  <circle cx="560" cy="315" r="28" class="hidden"/>
  <text x="560" y="323" text-anchor="middle" class="label">h2</text>
  <circle cx="560" cy="420" r="28" class="hidden"/>
  <text x="560" y="428" text-anchor="middle" class="label">h3</text>
  <text x="560" y="470" text-anchor="middle" class="small">先算出一组中间特征</text>

  <rect x="360" y="500" width="170" height="60" class="act"/>
  <text x="445" y="526" text-anchor="middle" class="label">b1</text>
  <text x="445" y="548" text-anchor="middle" class="small">第一层 bias</text>

  <text x="560" y="600" text-anchor="middle" class="eq">Z1 = X @ W1 + b1</text>
  <text x="560" y="624" text-anchor="middle" class="eq">A1 = tanh(Z1)</text>

  <rect x="770" y="250" width="120" height="68" class="act"/>
  <text x="830" y="279" text-anchor="middle" class="label">tanh</text>
  <text x="830" y="301" text-anchor="middle" class="small">加非线性</text>

  <text x="1200" y="160" text-anchor="middle" class="label">第二层</text>
  <circle cx="1200" cy="315" r="36" class="output"/>
  <text x="1200" y="323" text-anchor="middle" class="label">z2</text>
  <text x="1200" y="362" text-anchor="middle" class="small">把中间特征合成一个分数</text>
  <text x="1200" y="390" text-anchor="middle" class="eq">Z2 = A1 @ W2 + b2</text>

  <rect x="1040" y="500" width="170" height="60" class="act"/>
  <text x="1125" y="526" text-anchor="middle" class="label">b2</text>
  <text x="1125" y="548" text-anchor="middle" class="small">第二层 bias</text>

  <rect x="1360" y="250" width="130" height="68" class="act"/>
  <text x="1425" y="279" text-anchor="middle" class="label">sigmoid</text>
  <text x="1425" y="301" text-anchor="middle" class="small">压成概率</text>

  <circle cx="1620" cy="315" r="32" class="output"/>
  <text x="1620" y="323" text-anchor="middle" class="label">p</text>
  <text x="1620" y="362" text-anchor="middle" class="small">最终概率</text>

  <line x1="200" y1="250" x2="530" y2="210" class="arrow"/>
  <line x1="200" y1="250" x2="530" y2="315" class="arrow2"/>
  <line x1="200" y1="250" x2="530" y2="420" class="arrow3"/>

  <line x1="200" y1="350" x2="530" y2="210" class="arrow2"/>
  <line x1="200" y1="350" x2="530" y2="315" class="arrow"/>
  <line x1="200" y1="350" x2="530" y2="420" class="arrow2"/>

  <line x1="530" y1="210" x2="770" y2="275" class="arrow"/>
  <line x1="530" y1="315" x2="770" y2="275" class="arrow2"/>
  <line x1="530" y1="420" x2="770" y2="275" class="arrow3"/>

  <line x1="890" y1="275" x2="1160" y2="315" class="arrow"/>

  <line x1="1220" y1="315" x2="1360" y2="275" class="arrow"/>
  <line x1="1490" y1="275" x2="1588" y2="315" class="arrow"/>

  <line x1="530" y1="540" x2="1120" y2="540" class="arrow3 thin"/>
  <line x1="450" y1="500" x2="560" y2="448" class="arrow3 thin"/>
  <line x1="1125" y1="500" x2="1200" y2="351" class="arrow3 thin"/>

  <text x="820" y="180" text-anchor="middle" class="eq">W1 负责把输入映射成中间特征</text>
  <text x="1430" y="180" text-anchor="middle" class="eq">W2 负责把中间特征合成输出分数</text>

  <rect x="120" y="640" width="1560" height="42" class="panel"/>
  <text x="900" y="668" text-anchor="middle" class="eq">p = sigmoid(tanh(X @ W1 + b1) @ W2 + b2)</text>
</svg>
