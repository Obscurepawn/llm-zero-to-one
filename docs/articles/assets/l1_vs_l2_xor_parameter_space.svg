<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980">
  <defs>
    <style>
      .title { font: 700 32px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .subtitle { font: 500 18px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
      .panel-title { font: 700 24px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .label { font: 600 18px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .small { font: 500 16px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
      .tiny { font: 500 14px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #6b7280; }
      .code { font: 600 16px 'JetBrains Mono', 'Consolas', monospace; fill: #1f2937; }
      .panel { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 18; ry: 18; }
      .note { fill: #eef2ff; stroke: #2563eb; stroke-width: 1.6; rx: 14; ry: 14; }
      .node-input { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
      .node-hidden { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .node-output { fill: #dcfce7; stroke: #166534; stroke-width: 2; }
      .node-bias { fill: #fde68a; stroke: #a16207; stroke-width: 2; }
      .arrow { stroke: #2563eb; stroke-width: 2.8; fill: none; marker-end: url(#arrowhead); }
      .axis { stroke: #374151; stroke-width: 2; }
      .contour { fill: none; stroke: #9ca3af; stroke-width: 2; }
      .contour-light { fill: none; stroke: #d1d5db; stroke-width: 2; }
      .l2 { fill: rgba(37, 99, 235, 0.10); stroke: #2563eb; stroke-width: 3; }
      .l1 { fill: rgba(217, 119, 6, 0.10); stroke: #d97706; stroke-width: 3; }
      .opt { fill: #dc2626; stroke: #991b1b; stroke-width: 2; }
      .legend-line { stroke-width: 3; fill: none; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1680" height="980" fill="#ffffff"/>

  <text x="840" y="44" text-anchor="middle" class="title">L1 vs L2：在 XOR 上，正则化怎样限制参数搜索空间</text>
  <text x="840" y="76" text-anchor="middle" class="subtitle">关键点：正则化限制的是参数 θ 的搜索空间，而不是输入空间 (x1, x2)。图中的参数空间只是真实高维空间的一张二维切片。</text>

  <rect x="40" y="120" width="520" height="740" class="panel"/>
  <text x="300" y="158" text-anchor="middle" class="panel-title">1. XOR 任务与可行解来源</text>

  <rect x="72" y="190" width="220" height="220" class="note"/>
  <text x="182" y="220" text-anchor="middle" class="label">XOR 输入空间</text>
  <line x1="110" y1="378" x2="250" y2="378" class="axis"/>
  <line x1="180" y1="390" x2="180" y2="238" class="axis"/>
  <text x="254" y="384" class="tiny">x1</text>
  <text x="186" y="236" class="tiny">x2</text>

  <circle cx="140" cy="338" r="10" fill="#2563eb"/>
  <circle cx="220" cy="258" r="10" fill="#2563eb"/>
  <circle cx="140" cy="258" r="10" fill="#dc2626"/>
  <circle cx="220" cy="338" r="10" fill="#dc2626"/>
  <text x="182" y="404" text-anchor="middle" class="small">单层线性边界无法把 XOR 分开</text>

  <rect x="316" y="190" width="212" height="220" class="note"/>
  <text x="422" y="220" text-anchor="middle" class="label">最小两层 MLP</text>

  <circle cx="344" cy="270" r="18" class="node-bias"/>
  <text x="344" y="276" text-anchor="middle" class="small">1</text>
  <circle cx="344" cy="320" r="22" class="node-input"/>
  <text x="344" y="327" text-anchor="middle" class="small">x1</text>
  <circle cx="344" cy="380" r="22" class="node-input"/>
  <text x="344" y="387" text-anchor="middle" class="small">x2</text>

  <circle cx="430" cy="300" r="24" class="node-hidden"/>
  <text x="430" y="307" text-anchor="middle" class="small">z1</text>
  <circle cx="430" cy="370" r="24" class="node-hidden"/>
  <text x="430" y="377" text-anchor="middle" class="small">z2</text>

  <circle cx="512" cy="335" r="24" class="node-output"/>
  <text x="512" y="342" text-anchor="middle" class="small">p</text>

  <line x1="362" y1="270" x2="408" y2="292" class="arrow"/>
  <line x1="362" y1="270" x2="408" y2="362" class="arrow"/>
  <line x1="366" y1="320" x2="406" y2="304" class="arrow"/>
  <line x1="366" y1="320" x2="406" y2="358" class="arrow"/>
  <line x1="366" y1="380" x2="406" y2="316" class="arrow"/>
  <line x1="366" y1="380" x2="406" y2="374" class="arrow"/>
  <line x1="454" y1="300" x2="488" y2="327" class="arrow"/>
  <line x1="454" y1="370" x2="488" y2="343" class="arrow"/>

  <text x="382" y="292" class="tiny">b1_1</text>
  <text x="378" y="342" class="tiny">w1</text>
  <text x="372" y="368" class="tiny">w3</text>
  <text x="382" y="334" class="tiny">b1_2</text>
  <text x="378" y="334" class="tiny" visibility="hidden">.</text>
  <text x="382" y="352" class="tiny">w2</text>
  <text x="374" y="390" class="tiny">w4</text>
  <text x="462" y="322" class="tiny">v1</text>
  <text x="462" y="358" class="tiny">v2</text>

  <text x="300" y="458" text-anchor="middle" class="code">z1 = w1*x1 + w3*x2 + b1_1</text>
  <text x="300" y="486" text-anchor="middle" class="code">z2 = w2*x1 + w4*x2 + b1_2</text>
  <text x="300" y="514" text-anchor="middle" class="code">h1 = tanh(z1),  h2 = tanh(z2)</text>
  <text x="300" y="542" text-anchor="middle" class="code">p = sigmoid(v1*h1 + v2*h2 + b2)</text>

  <rect x="74" y="584" width="452" height="200" class="note"/>
  <text x="300" y="618" text-anchor="middle" class="label">把所有参数收成一个向量</text>
  <text x="300" y="652" text-anchor="middle" class="code">θ = [w1, w2, w3, w4, b1_1, b1_2, v1, v2, b2]</text>
  <text x="300" y="694" text-anchor="middle" class="small">真实训练是在高维参数空间里搜索 θ。</text>
  <text x="300" y="722" text-anchor="middle" class="small">XOR 对两层 MLP 来说通常存在不止一组可行解：</text>
  <text x="300" y="748" text-anchor="middle" class="small">有的解权重很大、边界很激进；有的解更平滑；</text>
  <text x="300" y="774" text-anchor="middle" class="small">如果隐藏层更宽，还会有很多冗余连接和冗余神经元。</text>

  <rect x="600" y="120" width="500" height="740" class="panel"/>
  <text x="850" y="158" text-anchor="middle" class="panel-title">2. L2 正则化：球形约束，整体收缩</text>

  <text x="850" y="210" text-anchor="middle" class="code">min  L_XOR(θ) + λ||θ||²_2</text>
  <text x="850" y="240" text-anchor="middle" class="code">≈  min  L_XOR(θ),  s.t. ||θ||_2 ≤ c</text>
  <text x="850" y="270" text-anchor="middle" class="small">图中画的是参数空间的一张二维切片：横轴 θ_a，纵轴 θ_b。</text>

  <line x1="690" y1="720" x2="1020" y2="720" class="axis"/>
  <line x1="760" y1="790" x2="760" y2="350" class="axis"/>
  <text x="1026" y="726" class="tiny">θ_a</text>
  <text x="766" y="344" class="tiny">θ_b</text>
  <text x="750" y="736" class="tiny">0</text>

  <ellipse cx="902" cy="560" rx="190" ry="120" class="contour-light"/>
  <ellipse cx="902" cy="560" rx="140" ry="88" class="contour"/>
  <ellipse cx="902" cy="560" rx="92" ry="58" class="contour"/>
  <text x="930" y="456" class="small">同一组 XOR 训练损失等高线</text>

  <circle cx="760" cy="720" r="165" class="l2"/>
  <text x="760" y="530" text-anchor="middle" class="small">L2 约束集</text>
  <text x="760" y="552" text-anchor="middle" class="code">||θ||_2 ≤ c</text>

  <circle cx="868" cy="595" r="8" class="opt"/>
  <text x="890" y="598" class="small">θ_(L2)</text>

  <rect x="662" y="790" width="376" height="56" class="note"/>
  <text x="850" y="824" text-anchor="middle" class="small">L2 往往让所有参数一起变小，但不一定把某些参数压成 0。</text>

  <rect x="1140" y="120" width="500" height="740" class="panel"/>
  <text x="1390" y="158" text-anchor="middle" class="panel-title">3. L1 正则化：菱形约束，更容易得到稀疏解</text>

  <text x="1390" y="210" text-anchor="middle" class="code">min  L_XOR(θ) + λ||θ||_1</text>
  <text x="1390" y="240" text-anchor="middle" class="code">≈  min  L_XOR(θ),  s.t. ||θ||_1 ≤ c</text>
  <text x="1390" y="270" text-anchor="middle" class="small">菱形有尖角，loss 等高线更容易先碰到角点。</text>

  <line x1="1230" y1="720" x2="1560" y2="720" class="axis"/>
  <line x1="1300" y1="790" x2="1300" y2="350" class="axis"/>
  <text x="1566" y="726" class="tiny">θ_a</text>
  <text x="1306" y="344" class="tiny">θ_b</text>
  <text x="1290" y="736" class="tiny">0</text>

  <ellipse cx="1442" cy="560" rx="190" ry="120" class="contour-light"/>
  <ellipse cx="1442" cy="560" rx="140" ry="88" class="contour"/>
  <ellipse cx="1442" cy="560" rx="92" ry="58" class="contour"/>
  <text x="1468" y="456" class="small">同一组 XOR 训练损失等高线</text>

  <polygon points="1300,545 1455,720 1300,895 1145,720" class="l1"/>
  <text x="1300" y="518" text-anchor="middle" class="small">L1 约束集</text>
  <text x="1300" y="540" text-anchor="middle" class="code">||θ||_1 ≤ c</text>

  <circle cx="1455" cy="720" r="8" class="opt"/>
  <text x="1478" y="724" class="small">θ_(L1)</text>
  <text x="1492" y="748" class="tiny">一个坐标为 0 的角点</text>

  <rect x="1202" y="790" width="376" height="56" class="note"/>
  <text x="1390" y="824" text-anchor="middle" class="small">L1 更容易把一部分参数直接压到 0，得到稀疏解。</text>

  <rect x="40" y="890" width="1600" height="58" class="note"/>
  <text x="840" y="924" text-anchor="middle" class="small">在 XOR 上，正则化不会把“不会做 XOR 的单层线性模型”变成“会做 XOR 的模型”；它只是在“已经能解 XOR 的两层 MLP”里，偏好某一类参数解。</text>

  <rect x="40" y="954" width="1600" height="16" fill="none"/>
</svg>
