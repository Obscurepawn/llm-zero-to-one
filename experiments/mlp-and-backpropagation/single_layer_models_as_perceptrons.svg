<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1220" viewBox="0 0 1720 1220">
  <defs>
    <style>
      .title { font: 700 30px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .subtitle { font: 500 18px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
      .panel-title { font: 700 24px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .panel-subtitle { font: 500 17px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
      .label { font: 600 18px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #111827; }
      .small { font: 500 16px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #4b5563; }
      .tiny { font: 500 14px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #6b7280; }
      .eq { font: 600 17px 'JetBrains Mono', 'Consolas', monospace; fill: #1f2937; }
      .weight { font: 600 15px 'JetBrains Mono', 'Consolas', monospace; fill: #1d4ed8; }
      .weight-x1 { fill: #2563eb; }
      .weight-x2 { fill: #059669; }
      .weight-bias1 { fill: #d97706; }
      .legend { font: 500 15px 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #374151; }
      .panel { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 20; ry: 20; }
      .note { fill: #eef2ff; stroke: #2563eb; stroke-width: 1.8; rx: 14; ry: 14; }
      .input-node { fill: #fef3c7; stroke: #92400e; stroke-width: 2; }
      .bias-node { fill: #fde68a; stroke: #92400e; stroke-width: 2; }
      .sum-node { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.4; }
      .output-node { fill: #dcfce7; stroke: #166534; stroke-width: 2.2; }
      .activation { fill: #fce7f3; stroke: #be185d; stroke-width: 2; rx: 14; ry: 14; }
      .flow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .flow-thin { stroke: #60a5fa; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .flow-x1 { stroke: #2563eb; stroke-width: 2.4; fill: none; marker-end: url(#arrow-x1); }
      .flow-x2 { stroke: #059669; stroke-width: 2.4; fill: none; marker-end: url(#arrow-x2); }
      .flow-bias1 { stroke: #d97706; stroke-width: 2.4; fill: none; marker-end: url(#arrow-bias1); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-x1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-x2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-bias1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1720" height="1220" fill="#ffffff"/>

  <text x="860" y="46" text-anchor="middle" class="title">线性回归和逻辑回归，本质上都是最简单的单层感知机</text>
  <text x="860" y="78" text-anchor="middle" class="subtitle">把“加权求和 + 激活函数”这个神经元骨架看清楚，再去理解多层感知机，会顺很多。</text>

  <rect x="40" y="120" width="780" height="430" class="panel"/>
  <text x="430" y="158" text-anchor="middle" class="panel-title">线性回归</text>
  <text x="430" y="184" text-anchor="middle" class="panel-subtitle">一个输出神经元，激活函数相当于 identity</text>

  <circle cx="120" cy="228" r="24" class="bias-node"/>
  <text x="120" y="235" text-anchor="middle" class="label">1</text>
  <text x="120" y="270" text-anchor="middle" class="tiny">bias</text>

  <circle cx="120" cy="306" r="28" class="input-node"/>
  <text x="120" y="313" text-anchor="middle" class="label">x1</text>

  <circle cx="120" cy="392" r="28" class="input-node"/>
  <text x="120" y="399" text-anchor="middle" class="label">x2</text>

  <line x1="146" y1="228" x2="332" y2="274" class="flow"/>
  <line x1="148" y1="306" x2="332" y2="290" class="flow"/>
  <line x1="148" y1="392" x2="332" y2="306" class="flow"/>
  <text x="220" y="242" class="weight">b</text>
  <text x="220" y="292" class="weight">w1</text>
  <text x="220" y="362" class="weight">w2</text>

  <circle cx="374" cy="290" r="42" class="sum-node"/>
  <text x="374" y="280" text-anchor="middle" class="label">神经元</text>
  <text x="374" y="306" text-anchor="middle" class="eq">Σ</text>
  <text x="374" y="348" text-anchor="middle" class="tiny">加权求和</text>

  <line x1="416" y1="290" x2="494" y2="290" class="flow"/>

  <rect x="494" y="248" width="120" height="84" class="activation"/>
  <text x="554" y="282" text-anchor="middle" class="label">激活函数</text>
  <text x="554" y="310" text-anchor="middle" class="eq">identity</text>

  <line x1="614" y1="290" x2="688" y2="290" class="flow"/>

  <circle cx="724" cy="290" r="28" class="output-node"/>
  <text x="724" y="297" text-anchor="middle" class="label">y_hat</text>

  <rect x="84" y="450" width="676" height="70" class="note"/>
  <text x="422" y="480" text-anchor="middle" class="eq">z = w1 * x1 + w2 * x2 + b</text>
  <text x="422" y="508" text-anchor="middle" class="small">y_hat = identity(z) = z，输出是连续值，常见损失函数是 MSE。</text>

  <rect x="900" y="120" width="780" height="430" class="panel"/>
  <text x="1290" y="158" text-anchor="middle" class="panel-title">逻辑回归</text>
  <text x="1290" y="184" text-anchor="middle" class="panel-subtitle">仍然只有一个输出神经元，只是在输出前接上 sigmoid</text>

  <circle cx="980" cy="228" r="24" class="bias-node"/>
  <text x="980" y="235" text-anchor="middle" class="label">1</text>
  <text x="980" y="270" text-anchor="middle" class="tiny">bias</text>

  <circle cx="980" cy="306" r="28" class="input-node"/>
  <text x="980" y="313" text-anchor="middle" class="label">x1</text>

  <circle cx="980" cy="392" r="28" class="input-node"/>
  <text x="980" y="399" text-anchor="middle" class="label">x2</text>

  <line x1="1006" y1="228" x2="1192" y2="274" class="flow"/>
  <line x1="1008" y1="306" x2="1192" y2="290" class="flow"/>
  <line x1="1008" y1="392" x2="1192" y2="306" class="flow"/>
  <text x="1080" y="242" class="weight">b</text>
  <text x="1080" y="292" class="weight">w1</text>
  <text x="1080" y="362" class="weight">w2</text>

  <circle cx="1234" cy="290" r="42" class="sum-node"/>
  <text x="1234" y="280" text-anchor="middle" class="label">神经元</text>
  <text x="1234" y="306" text-anchor="middle" class="eq">Σ</text>
  <text x="1234" y="348" text-anchor="middle" class="tiny">加权求和</text>

  <line x1="1276" y1="290" x2="1354" y2="290" class="flow"/>

  <rect x="1354" y="248" width="120" height="84" class="activation"/>
  <text x="1414" y="282" text-anchor="middle" class="label">激活函数</text>
  <text x="1414" y="310" text-anchor="middle" class="eq">sigmoid</text>

  <line x1="1474" y1="290" x2="1548" y2="290" class="flow"/>

  <circle cx="1584" cy="290" r="28" class="output-node"/>
  <text x="1584" y="297" text-anchor="middle" class="label">p</text>

  <rect x="944" y="450" width="676" height="70" class="note"/>
  <text x="1282" y="480" text-anchor="middle" class="eq">z = w1 * x1 + w2 * x2 + b</text>
  <text x="1282" y="508" text-anchor="middle" class="small">p = sigmoid(z)，输出可以解释成概率，常见损失函数是 Binary Cross Entropy。</text>

  <rect x="40" y="600" width="1640" height="520" class="panel"/>
  <text x="860" y="640" text-anchor="middle" class="panel-title">两层 MLP</text>
  <text x="860" y="666" text-anchor="middle" class="panel-subtitle">多出来的不是“更多线性层”本身，而是隐藏层里的非线性激活</text>

  <circle cx="150" cy="700" r="22" class="bias-node"/>
  <text x="150" y="706" text-anchor="middle" class="label">1</text>
  <text x="150" y="740" text-anchor="middle" class="tiny">bias</text>

  <circle cx="150" cy="810" r="28" class="input-node"/>
  <text x="150" y="817" text-anchor="middle" class="label">x1</text>

  <circle cx="150" cy="920" r="28" class="input-node"/>
  <text x="150" y="927" text-anchor="middle" class="label">x2</text>

  <line x1="176" y1="810" x2="474" y2="786" class="flow-x1"/>
  <line x1="176" y1="810" x2="474" y2="894" class="flow-x1"/>
  <line x1="176" y1="920" x2="474" y2="804" class="flow-x2"/>
  <line x1="176" y1="920" x2="474" y2="876" class="flow-x2"/>
  <line x1="172" y1="706" x2="482" y2="774" class="flow-bias1"/>
  <line x1="172" y1="714" x2="482" y2="886" class="flow-bias1"/>

  <text x="258" y="732" class="weight weight-bias1">b1_1</text>
  <text x="258" y="790" class="weight weight-bias1">b1_2</text>
  <text x="314" y="792" class="weight weight-x1">w1</text>
  <text x="300" y="842" class="weight weight-x1">w2</text>
  <text x="362" y="860" class="weight weight-x2">w3</text>
  <text x="348" y="910" class="weight weight-x2">w4</text>

  <circle cx="516" cy="786" r="38" class="sum-node"/>
  <text x="516" y="778" text-anchor="middle" class="eq">Σ</text>
  <text x="516" y="804" text-anchor="middle" class="tiny">z1</text>

  <circle cx="516" cy="894" r="38" class="sum-node"/>
  <text x="516" y="886" text-anchor="middle" class="eq">Σ</text>
  <text x="516" y="912" text-anchor="middle" class="tiny">z2</text>

  <line x1="554" y1="786" x2="626" y2="786" class="flow-thin"/>
  <line x1="554" y1="894" x2="626" y2="894" class="flow-thin"/>

  <rect x="626" y="746" width="100" height="80" class="activation"/>
  <text x="676" y="778" text-anchor="middle" class="label">激活</text>
  <text x="676" y="806" text-anchor="middle" class="eq">tanh</text>

  <rect x="626" y="854" width="100" height="80" class="activation"/>
  <text x="676" y="886" text-anchor="middle" class="label">激活</text>
  <text x="676" y="914" text-anchor="middle" class="eq">tanh</text>

  <line x1="726" y1="786" x2="786" y2="786" class="flow-thin"/>
  <line x1="726" y1="894" x2="786" y2="894" class="flow-thin"/>

  <circle cx="822" cy="786" r="26" class="output-node"/>
  <text x="822" y="793" text-anchor="middle" class="label">h1</text>

  <circle cx="822" cy="894" r="26" class="output-node"/>
  <text x="822" y="901" text-anchor="middle" class="label">h2</text>

  <circle cx="1174" cy="692" r="22" class="bias-node"/>
  <text x="1174" y="698" text-anchor="middle" class="label">1</text>
  <text x="1174" y="732" text-anchor="middle" class="tiny">b2</text>

  <line x1="848" y1="786" x2="1134" y2="860" class="flow"/>
  <line x1="848" y1="894" x2="1134" y2="880" class="flow"/>
  <line x1="1174" y1="714" x2="1174" y2="818" class="flow"/>

  <text x="972" y="844" class="weight">W2</text>

  <circle cx="1174" cy="870" r="42" class="sum-node"/>
  <text x="1174" y="860" text-anchor="middle" class="label">输出层</text>
  <text x="1174" y="886" text-anchor="middle" class="eq">Σ</text>

  <line x1="1216" y1="870" x2="1298" y2="870" class="flow"/>

  <rect x="1298" y="828" width="120" height="84" class="activation"/>
  <text x="1358" y="862" text-anchor="middle" class="label">激活函数</text>
  <text x="1358" y="890" text-anchor="middle" class="eq">sigmoid</text>

  <line x1="1418" y1="870" x2="1496" y2="870" class="flow"/>

  <circle cx="1534" cy="870" r="28" class="output-node"/>
  <text x="1534" y="877" text-anchor="middle" class="label">p</text>

  <rect x="120" y="970" width="1480" height="108" class="note"/>
  <text x="860" y="1008" text-anchor="middle" class="eq">h = tanh(X @ W1 + b1)</text>
  <text x="860" y="1040" text-anchor="middle" class="eq">p = sigmoid(h @ W2 + b2)</text>
  <text x="860" y="1066" text-anchor="middle" class="small">第一层共享一个固定输入 1 的 bias 节点，但它通过两条不同权重边分别作用在 z1 和 z2；这两条边合起来对应公式里的偏置向量 b1。输出层只有一个神经元，所以只有一个 b2。</text>

  <rect x="80" y="1144" width="1560" height="34" class="note"/>
  <text x="860" y="1167" text-anchor="middle" class="legend">蓝色圆形表示神经元里的线性求和，粉色框表示激活函数，连线旁边的 W / b 表示权重和偏置。线性回归与逻辑回归都只有一个输出神经元，所以它们都属于最简单的单层感知机。</text>
</svg>
